name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - name: Install and run the command
        run: |
          pip install .
          statusdoc --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  action:
    name: GitHub Action
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: status
        uses: ./
        with:
          services: |
            github.com
            npmjs.com
          fail-on: never
      - name: Outputs are set
        shell: bash
        run: |
          echo "worst level: ${{ steps.status.outputs.worst-level }}"
          test -n "${{ steps.status.outputs.worst-level }}"
          test "${{ steps.status.outputs.degraded }}" = false

  action-system-python:
    name: GitHub Action (system Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: status
        uses: ./
        with:
          services: github.com
          fail-on: never
      - run: test -n "${{ steps.status.outputs.worst-level }}"

