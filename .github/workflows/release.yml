name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish again, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version
        run: test "${TAG#v}" = "$(python -c 'import statusdoc; print(statusdoc.__version__)')"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Skipped when the release exists (publishing an existing tag again).
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" dist/* --title "$TAG" --generate-notes

  pypi:
    # Trusted publishing: enabled once the PyPI project trusts this workflow
    # and the repository variable PYPI_PUBLISH is set to true.
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
